
{% extends 'base.html' %}

{% block title %}New Post | Django Blog{% endblock title %}

{% block content %}
    <div class="form-card">
        <h2>Create a New Blog Post</h2>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="button">Publish Post</button>
        </form>
    </div>
{% endblock content %}
