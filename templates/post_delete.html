
{% extends "base.html" %}

{% block title %}Delete Post | Django Blog{% endblock title %}

{% block content %}
    <div class="post-entry">
        <h2>Delete Blog Post</h2>

        <p>
            Are you sure you want to delete
            "<strong>{{ post.title }}</strong>"?
        </p>

        <form method="post">
            {% csrf_token %}
            <button type="submit">Yes, Delete Post</button>
            <a href="{% url 'post_detail' post.pk %}">Cancel</a>
        </form>
    </div>
{% endblock content %}
