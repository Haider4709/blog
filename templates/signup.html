
{% extends 'base.html' %}

{% block title %}Sign Up | Django Blog{% endblock title %}

{% block content %}
<div class="form-card">
    <h2>Create an Account</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button">Sign Up</button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">Log In</a>
    </p>
</div>
{% endblock content %}
