
{% extends 'base.html' %}

{% block title %}{{ post.title }} | Django Blog{% endblock title %}

{% block content %}
    <article class="post-detail">
        <h2>{{ post.title }}</h2>

        <p class="author">By {{ post.author }}</p>

        <div class="post-body">
            {{ post.body|linebreaks }}
        </div>

        <a href="{% url 'home' %}" class="button">
            ← Back to Home
        </a>
    </article>
{% endblock content %}
